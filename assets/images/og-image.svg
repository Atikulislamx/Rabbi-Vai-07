<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  <!-- Logo Box -->
  <rect x="450" y="140" width="300" height="300" rx="40" fill="url(#accent-gradient)"/>
  <!-- Logo Text -->
  <text x="600" y="320" font-family="Georgia, serif" font-size="120" font-weight="bold" fill="white" text-anchor="middle">RV</text>
  <!-- Name -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Rabbi Vai 07</text>
  <!-- Tagline -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Content Creator &amp; Influencer</text>
</svg>
